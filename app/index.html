<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b3d2e">
<meta name="robots" content="noindex">
<title>Trip Helper · 自助旅程領航</title>
<style>
  :root{--green:#0b3d2e; --green2:#14724f; --lgreen:#e6f4ec; --amber:#b45309;
    --red:#b91c1c; --lred:#fdecec; --blue:#1d4ed8; --ink:#1a1a1a; --mut:#5b6b63;
    --bg:#f4f6f5; --card:#fff}
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html{font-size:17px}
  body{margin:0; font-family:-apple-system,"PingFang HK","PingFang TC","Microsoft JhengHei",Roboto,"Noto Sans TC",sans-serif;
       background:var(--bg); color:var(--ink); line-height:1.55; padding-bottom:76px}
  header{background:var(--green); color:#fff; padding:12px 16px; position:sticky; top:0; z-index:40;
         display:flex; justify-content:space-between; align-items:baseline}
  header b{font-size:1.05rem}
  header small{opacity:.75; font-size:.72rem}
  main{max-width:560px; margin:0 auto; padding:10px 12px}
  .tabc{display:none} .tabc.on{display:block}
  #tabbar{position:fixed; bottom:0; left:0; right:0; z-index:50; display:flex; background:var(--green);
          padding-bottom:env(safe-area-inset-bottom); box-shadow:0 -2px 10px rgba(0,0,0,.3)}
  #tabbar a{flex:1; text-align:center; color:#cfe8dc; text-decoration:none; font-weight:800; font-size:.78rem;
            padding:10px 2px 8px; border-top:3px solid transparent}
  #tabbar a.on{color:#ffd23f; border-top-color:#ffd23f}
  #tabbar a span{display:block; font-size:1.15rem}

  .tripname{font-weight:800; color:var(--green); margin:4px 2px 10px; font-size:1.05rem}
  .day{background:var(--card); border-radius:16px; margin:0 0 14px; box-shadow:0 1px 4px rgba(0,0,0,.08); overflow:hidden}
  .dh{background:var(--green); color:#fff; padding:8px 14px; display:flex; gap:10px; align-items:baseline}
  .dh b{color:#ffd23f} .dh span{flex:1; font-weight:700} .dhb{flex:none}
  .leg{display:flex; gap:10px; padding:10px 12px; border-bottom:1px solid #eef2ee}
  .leg:last-of-type{border-bottom:none}
  .lt{flex:none; width:64px; font-weight:800; color:var(--green); font-variant-numeric:tabular-nums; font-size:.95rem}
  .lb{flex:1; min-width:0}
  .lw{font-weight:700; font-size:.95rem}
  .ll{font-size:.84rem; margin-top:2px}
  .ll a{color:var(--blue); font-weight:700}
  .ln{font-size:.84rem; color:var(--mut); margin-top:2px}
  .la{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px}
  .chip{border:1.5px solid #d6ddd8; background:#f6f8f6; border-radius:999px; padding:4px 12px;
        font-size:.8rem; font-weight:700; color:var(--ink); text-decoration:none; font-family:inherit}
  .chip.go{background:var(--green2); border-color:var(--green2); color:#fff}
  .b{display:inline-block; border-radius:999px; padding:0 8px; font-size:.7rem; font-weight:800}
  .b.ok{background:var(--lgreen); color:var(--green2)}
  .b.na{background:var(--lred); color:var(--red)}
  .b.file{background:#eef; color:var(--blue)}
  .add{display:block; width:100%; border:1.5px dashed #bcc9c0; background:#fbfdfb; border-radius:12px;
       padding:10px; font-weight:800; color:var(--green2); font-size:.9rem; font-family:inherit; margin:8px 0}
  .add.big{margin:4px 0 20px}
  .add.danger{color:var(--red); border-color:#e2b5b5}
  .mini{border:none; background:rgba(255,255,255,.18); color:inherit; border-radius:8px; padding:2px 8px;
        font-size:.75rem; font-weight:700; font-family:inherit}
  .day .mini{color:#fff}
  .tripname .mini,.fhead .mini,.ccard .mini{background:#eef1ef; color:var(--ink)}
  .empty,.hint{color:var(--mut); font-size:.85rem; margin:8px 2px}

  .upl{display:block; text-align:center; background:var(--green2); color:#fff; font-weight:800;
       border-radius:12px; padding:13px; margin:6px 0 14px}
  .fcard{background:var(--card); border-radius:14px; padding:10px 12px; margin:0 0 12px; box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .fhead{display:flex; justify-content:space-between; gap:8px; align-items:baseline}
  .ftags{display:flex; flex-wrap:wrap; gap:5px; margin:6px 0}
  .tag{background:var(--lgreen); color:var(--green2); border-radius:999px; padding:1px 9px; font-size:.72rem; font-weight:800; border:none; font-family:inherit}
  .tag.addtag{background:#eef1ef; color:var(--mut)}
  .meet{background:#fff8e1; border:1.5px dashed #e0c04a; border-radius:10px; padding:7px 10px; font-size:.8rem; color:#6b5300; margin:6px 0}
  .fthumb img,.fthumb canvas{max-width:100%; border-radius:10px; border:1px solid #e3e9e4; margin-top:4px}

  .spot .lt{width:86px; font-size:.82rem}
  .ccard{background:var(--card); border-radius:14px; padding:12px 14px; margin:0 0 10px; display:flex;
         justify-content:space-between; align-items:center; gap:8px; box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .ccard small{display:block; color:var(--mut); font-size:.75rem}
  .call{background:var(--green2); color:#fff; text-decoration:none; padding:8px 14px; border-radius:10px; font-weight:800; white-space:nowrap}

  .scard{background:var(--card); border-radius:16px; padding:12px 14px; margin:0 0 14px; box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .scard h3{margin:0 0 6px; color:var(--green); font-size:1rem}
  .qrbox{display:flex; justify-content:center; padding:8px 0}
  .qrbox svg{width:min(58vw,210px); height:auto}

  dialog{border:none; border-radius:16px; padding:0; width:min(92vw,420px)}
  dialog::backdrop{background:rgba(0,0,0,.45)}
  dialog form{padding:16px}
  dialog h3{margin:0 0 10px; color:var(--green)}
  dialog label{display:block; font-size:.82rem; font-weight:700; color:var(--mut); margin:8px 0}
  dialog label small{display:block; font-weight:400; font-size:.72rem; color:var(--amber)}
  dialog input,dialog textarea,dialog select{width:100%; font:inherit; font-size:.95rem; padding:8px 10px;
        border:1.5px solid #d6ddd8; border-radius:10px; margin-top:3px}
  .dlgbtns{display:flex; gap:8px; margin-top:12px}
  .dlgbtns button{flex:1; padding:11px; border:none; border-radius:12px; font-weight:800; font-family:inherit; font-size:.95rem}
  .dlgbtns .ok{background:var(--green2); color:#fff}

  #toast{position:fixed; left:50%; bottom:86px; transform:translateX(-50%) translateY(20px); background:#122;
         color:#fff; padding:9px 18px; border-radius:999px; font-size:.85rem; opacity:0; transition:.25s; z-index:99; pointer-events:none}
  #toast.on{opacity:1; transform:translateX(-50%)}
</style>
</head>
<body>
<header><b>🧭 Trip Helper</b><small>離線可用 · 資料只存喺你部機</small></header>
<main>
  <div class="tabc on" id="tab-trip"></div>
  <div class="tabc" id="tab-files"></div>
  <div class="tabc" id="tab-spots"></div>
  <div class="tabc" id="tab-sos"></div>
  <div class="tabc" id="tab-share"></div>
</main>
<nav id="tabbar">
  <a href="#trip" data-t="trip" class="on"><span>🗓</span>行程</a>
  <a href="#files" data-t="files"><span>🎫</span>車票檔案</a>
  <a href="#spots" data-t="spots"><span>📸</span>打卡</a>
  <a href="#sos" data-t="sos"><span>🆘</span>緊急</a>
  <a href="#share" data-t="share"><span>📲</span>分享</a>
</nav>
<dialog id="dlg">
  <form method="dialog">
    <h3 id="dlgTitle"></h3>
    <div id="dlgFields"></div>
    <div class="dlgbtns">
      <button value="cancel">取消</button>
      <button value="ok" class="ok">儲存</button>
    </div>
  </form>
</dialog>
<div id="toast"></div>
<script src="vendor/lz-string.min.js"></script>
<script src="vendor/qrcode.min.js"></script>
<script src="vendor/pdf.min.js"></script>
<script src="app.js"></script>
</body>
</html>
